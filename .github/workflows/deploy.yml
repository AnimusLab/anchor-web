name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prepare Clean Git Repository
        run: |
          rm -rf .git
          git init -b main
          git config --global user.email "deploy@animuslab.dev"
          git config --global user.name "AnimusLab Deploy Bot"
          git add .
          git commit -m "deploy: production build for Hugging Face Space"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/AnimusLab/Anchor
          git push --force hf main
