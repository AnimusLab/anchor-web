# ==============================================================================
# ANCHOR GOVERNANCE PLATFORM — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Features: Strict Rate Limiting, Brute-Force Defense, Security Headers, SSL/TLS
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # 01. LOGGING & TRACEABILITY
    # --------------------------------------------------------------------------
    log_format anchor_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"rate_limit_status":"$limit_req_status"'
    '}';

    access_log /var/log/nginx/anchor_access.log anchor_json;
    error_log  /var/log/nginx/anchor_error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version banner

    # --------------------------------------------------------------------------
    # 02. RATE LIMITING & CONNECTION CONSTRAINTS
    # --------------------------------------------------------------------------
    # Zone 1: Login Gateway — Max 5 requests per minute per IP (Strict Brute-Force defense)
    limit_req_zone $binary_remote_addr zone=auth_login_limit:10m rate=5r/m;

    # Zone 2: Onboarding Submissions — Max 3 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=auth_onboard_limit:10m rate=3r/m;

    # Zone 3: General API Endpoints — Max 25 requests per second per IP (Burst 30)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=25r/s;

    # Zone 4: Connection limits — Max 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Return standard HTTP 429 Too Many Requests when limits are breached
    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # 03. UPSTREAM NEXT.JS APP & SERVER CLUSTER
    # --------------------------------------------------------------------------
    upstream nextjs_upstream {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 04. GZIP COMPRESSION
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 05. SERVER BLOCK (HTTP -> HTTPS REDIRECT & PRODUCTION GATEWAY)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name animuslab.dev hub.animuslab.dev oversight.animuslab.dev localhost;

        # Redirect all HTTP traffic to HTTPS (uncomment for production domain)
        # return 301 https://$host$request_uri;

        # For local / testing environments, route directly to upstream
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ----------------------------------------------------------------------
        # A. AUTHENTICATION LOGIN ROUTE (MAX 5 ATTEMPTS / MINUTE WITH BURST 3)
        # ----------------------------------------------------------------------
        location /api/auth/login {
            limit_req zone=auth_login_limit burst=3 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom Rate Limit Headers
            add_header X-RateLimit-Limit "5r/m" always;
        }

        # ----------------------------------------------------------------------
        # B. ONBOARDING REGISTRATION ROUTE (MAX 3 SUBMISSIONS / MINUTE)
        # ----------------------------------------------------------------------
        location /api/auth/onboard {
            limit_req zone=auth_onboard_limit burst=2 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # C. GENERAL API ROUTES (MAX 25 REQ/SEC WITH BURST 30)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_limit burst=30 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # D. NEXT.JS STATIC ASSETS (HIGH-EFFICIENCY CACHING)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------------------
        # E. CUSTOM 429 JSON ERROR PAGE
        # ----------------------------------------------------------------------
        error_page 429 = @rate_limited_json;
        location @rate_limited_json {
            default_type application/json;
            return 429 '{"success":false,"status":429,"error":"Too Many Requests","message":"🚫 Rate limit exceeded. Too many requests or failed login attempts. Please try again after a brief cooldown period.","retryAfterSeconds":60}';
        }

        # ----------------------------------------------------------------------
        # F. HARDENED SECURITY HEADERS
        # ----------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
